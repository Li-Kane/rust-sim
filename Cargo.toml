[package]
name = "rust-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
bevy_egui = "0.42.0"
bevy_rapier3d = "0.36.0"
tobj = { version = "4.0", default-features = false }
urdf-rs = "0.8"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
